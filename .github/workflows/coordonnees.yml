# Calcule automatiquement les coordonnées GPS des lieux ajoutés ou modifiés
# sans coordonnées (par exemple depuis Pages CMS).
name: Coordonnées GPS

on:
  push:
    branches: [main]
    paths: ['_data/lieux/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coordonnees
  cancel-in-progress: false

jobs:
  geocoder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calculer les coordonnées manquantes
        run: python3 scripts/importer.py --manquants

      - name: Enregistrer et republier
        run: |
          if git diff --quiet; then
            echo "Rien à faire."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/lieux
          git commit -m "Coordonnées GPS calculées automatiquement"
          git pull --rebase origin main
          git push origin HEAD:main  # GitHub Pages republie le site automatiquement
